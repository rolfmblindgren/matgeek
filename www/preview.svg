    <text x='32' y='56' fill='#fff' font-size='14' font-weight='800' letter-spacing='1.4'>PRAKTISK FYSIKK</text>
    <text x='32' y='132' fill='#fff' font-size='74' font-weight='900' letter-spacing='-2'>Matgeek</text>
    <text x='32' y='190' fill='#effffb' font-size='26' font-weight='700'>Vann, varme og kjøkkenlogikk</text>
    <text x='32' y='228' fill='rgba(255,255,255,.82)' font-size='18'>Regn ut det som faktisk skjer i gryta.</text>

    <g transform='translate(34 292)'>
      <rect width='120' height='34' rx='17' fill='rgba(255,255,255,.10)'/>
      <text x='60' y='23' text-anchor='middle' fill='#fff' font-size='14' font-weight='700'>Varme</text>
      <g transform='translate(134 0)'><rect width='120' height='34' rx='17' fill='rgba(255,255,255,.10)'/><text x='60' y='23' text-anchor='middle' fill='#fff' font-size='14' font-weight='700'>Blanding</text></g>
      <g transform='translate(268 0)'><rect width='120' height='34' rx='17' fill='rgba(255,255,255,.10)'/><text x='60' y='23' text-anchor='middle' fill='#fff' font-size='14' font-weight='700'>Energi</text></g>
    </g>
  </g>

  <g transform='translate(648 82)'>
    <rect width='490' height='466' rx='40' fill='rgba(255,255,255,.08)' stroke='rgba(255,255,255,.16)'/>
    <rect x='28' y='24' width='128' height='30' rx='15' fill='rgba(255,255,255,.10)'/>
    <text x='92' y='45' text-anchor='middle' fill='#fff' font-size='13' font-weight='800'>Shiny app</text>

