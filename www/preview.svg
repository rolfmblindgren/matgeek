      <rect width='422' height='330' rx='28' fill='rgba(8,18,28,.42)' stroke='rgba(255,255,255,.14)'/>

      <g transform='translate(24 24)'>
        <rect width='176' height='178' rx='26' fill='rgba(255,255,255,.09)' stroke='rgba(255,255,255,.16)'/>
        <rect x='26' y='30' width='124' height='22' rx='11' fill='url(#accent)' opacity='.95'/>
        <text x='88' y='46' text-anchor='middle' fill='#08202d' font-size='14' font-weight='900'>KJELE</text>
        <rect x='50' y='54' width='76' height='76' rx='20' fill='none' stroke='#fff' stroke-width='10'/>
        <path d='M68 34 C62 24, 64 14, 70 6' stroke='#ffe66d' stroke-width='7' stroke-linecap='round' fill='none'/>
        <path d='M88 30 C82 18, 82 8, 88 0' stroke='#63f2df' stroke-width='7' stroke-linecap='round' fill='none'/>
        <path d='M108 34 C102 22, 104 10, 112 2' stroke='#ffe66d' stroke-width='7' stroke-linecap='round' fill='none'/>
        <circle cx='88' cy='92' r='20' fill='#f08a24'/>
        <circle cx='88' cy='92' r='8' fill='#fff'/>
      </g>

      <g transform='translate(236 28)'>
        <rect width='146' height='170' rx='24' fill='rgba(255,255,255,.09)' stroke='rgba(255,255,255,.16)'/>
        <text x='73' y='34' text-anchor='middle' fill='#fff' font-size='16' font-weight='800'>Temp</text>
        <path d='M72 48 V114' stroke='#ffe66d' stroke-width='18' stroke-linecap='round'/>
        <circle cx='72' cy='114' r='36' fill='#63f2df'/>
        <text x='72' y='121' text-anchor='middle' fill='#08202d' font-size='22' font-weight='900'>°C</text>
