<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630' role='img' aria-labelledby='title desc'>
  <title id='title'>Matgeek</title>
  <desc id='desc'>Kjokkenfysikk med mer trøkk</desc>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0b2b3f'/>
      <stop offset='55%' stop-color='#0f7a6e'/>
      <stop offset='100%' stop-color='#f08a24'/>
    </linearGradient>
    <linearGradient id='glass' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='.22'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='.06'/>
    </linearGradient>
    <linearGradient id='accent' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#ffe66d'/>
      <stop offset='100%' stop-color='#63f2df'/>
    </linearGradient>
  </defs>
  <rect width='1200' height='630' fill='url(#bg)'/>
  <circle cx='1020' cy='120' r='210' fill='#ffe66d' opacity='.12'/>
  <circle cx='980' cy='540' r='280' fill='#63f2df' opacity='.10'/>
  <path d='M0 480 C200 410, 320 560, 520 500 S900 400, 1200 520 L1200 630 L0 630 Z' fill='rgba(255,255,255,.06)'/>

  <g transform='translate(70 72)'>
