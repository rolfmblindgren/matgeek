      <text x='44' y='263' fill='#fff' font-size='20' font-weight='800'>Nøyaktig nok til hverdagsbruk</text>
      <text x='44' y='284' fill='rgba(255,255,255,.76)' font-size='14'>ikke laboratoriefantasi</text>
    </g>
